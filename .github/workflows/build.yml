name: Build DriveVerse IPA

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate

      - name: Run unit tests
        run: |
          ./scripts/test.sh

      - name: Build unsigned iPhone and iPad app
        run: |
          set -euxo pipefail

          xcodebuild \
            -project DriveVerse.xcodeproj \
            -scheme DriveVerse \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify app and Live Activity extension
        run: |
          set -euxo pipefail

          APP="build/Build/Products/Release-iphoneos/DriveVerse.app"

          test -d "$APP"

          test -d \
            "$APP/PlugIns/DriveVerseWidgets.appex"

          test "$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:0' "$APP/Info.plist")" = "1"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:1' "$APP/Info.plist")" = "2"

          test "$(/usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$APP/Info.plist")" = "true"

          echo "App exists."
          echo "Live Activity extension exists."
          echo "Native iPhone and iPad support is enabled."

          echo "Embedded plug-ins:"
          find "$APP/PlugIns" -maxdepth 2 -type d -print

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail

          APP="build/Build/Products/Release-iphoneos/DriveVerse.app"

          rm -rf Payload
          rm -f DriveVerse-unsigned.ipa

          mkdir Payload
          cp -R "$APP" Payload/

          /usr/bin/zip \
            -qry \
            DriveVerse-unsigned.ipa \
            Payload

          echo "Checking IPA..."

          unzip -l DriveVerse-unsigned.ipa \
            | grep DriveVerseWidgets.appex

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DriveVerse-IPA
          path: DriveVerse-unsigned.ipa
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: DriveVerse-IPA

      - name: Publish release and upload IPA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -s DriveVerse-unsigned.ipa
          cat > release-notes.md <<'EOF'
          Download `DriveVerse-unsigned.ipa` below and sign it with AltStore before installing.
          Requires iOS 26 or later. Includes the iPhone/iPad app and Live Activity extension.

          下载下方的 `DriveVerse-unsigned.ipa`，使用 AltStore 签名后安装。
          需要 iOS 26 或更高版本，包含 iPhone/iPad 应用及实时活动扩展。
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" DriveVerse-unsigned.ipa --clobber
          else
            gh release create "$RELEASE_TAG" DriveVerse-unsigned.ipa \
              --verify-tag \
              --title "DriveVerse $RELEASE_TAG" \
              --notes-file release-notes.md
          fi
